<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0f0f0f;
            color: #e8e8e8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 680px;
            padding: 60px 24px;
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            color: #888;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .bio {
            font-size: 15px;
            color: #aaa;
            line-height: 1.8;
            margin-bottom: 40px;
            max-width: 520px;
            margin-left: auto;
            margin-right: auto;
        }

        .links {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .link-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .link-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .link-btn.secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e8e8e8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .link-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-2px);
        }

        .divider {
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            margin: 0 auto 40px;
            border-radius: 2px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 48px;
            margin-bottom: 40px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            .container { padding: 40px 16px; }
            h1 { font-size: 26px; }
            .avatar { width: 100px; height: 100px; font-size: 40px; }
            .stats { gap: 32px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">👤</div>
        <h1>你好，我是[你的名字]</h1>
        <p class="subtitle">开发者 / 创作者 / 终身学习者</p>
        <div class="divider"></div>
        <p class="bio">
            热爱技术与创造，专注于打造有趣、有用的产品。<br>
            用代码把想法变成现实。
        </p>
        <div class="stats">
            <div class="stat">
                <div class="stat-value">10+</div>
                <div class="stat-label">项目经验</div>
            </div>
            <div class="stat">
                <div class="stat-value">3年</div>
                <div class="stat-label">开发经验</div>
            </div>
            <div class="stat">
                <div class="stat-value">∞</div>
                <div class="stat-label">好奇心</div>
            </div>
        </div>
        <div class="links">
            <a href="#" class="link-btn primary">📧 联系我</a>
            <a href="#" class="link-btn secondary">🐙 GitHub</a>
            <a href="#" class="link-btn secondary">💼 作品集</a>
        </div>
    </div>
</body>
</html>
